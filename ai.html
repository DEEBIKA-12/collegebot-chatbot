<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>College Help Chatbot</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-image: url("rathinam-building.jpg");
      background-size: cover;
      background-position: center;
      height: 100vh;
      position: relative;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 60px;
    }

    h1 {
      color: #fff;
      text-align: center;
      text-shadow: 2px 2px 5px #000;
      margin-bottom: 20px;
    }

    /* Always visible chatbot widget */
    df-messenger {
      --df-messenger-button-titlebar-color: #4CAF50;
      --df-messenger-chat-background-color: #f1f1f1;
      position: fixed;
      bottom: 90px;
      right: 20px;
      z-index: 999;
    }

    @media (max-width: 400px) {
      df-messenger {
        right: 5%;
        width: 90%;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎓 College Help Chatbot</h1>
  </div>

  <!-- Dialogflow Messenger Script -->
  <script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>

  <!-- Dialogflow Messenger Chatbot using project ID -->
  <df-messenger
    intent="WELCOME"
    chat-title="College Help"
    project-id="collegebothelper-xyin"
    language-code="en"
    allow="microphone">
  </df-messenger>

</body>
</html>
